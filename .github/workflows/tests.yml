name: brew test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily, so a new Homebrew node or a broken dependency shows up here before users hit it.
  schedule:
    - cron: "0 12 * * *"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew audit --strict --new --online nearbycoder/soloagent/soloagent
      - run: brew install --build-from-source nearbycoder/soloagent/soloagent
      - run: brew test nearbycoder/soloagent/soloagent
      - run: soloagent --version
